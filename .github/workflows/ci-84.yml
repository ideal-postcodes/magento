name: Magento 2.4.8 CI with PHP 8.4

on:
  - push

permissions:
  contents: read

jobs:
  ci-84:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Launch Magento test environment
        env:
          PHP: "84"
          COMPOSE_INTERACTIVE_NO_CLI: "1"
        run: make up

      - name: Setup Node
        uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5.0.4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cypress run
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          project: ./test/e2e
          config: baseUrl=http://localhost:3000
          browser: chrome
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
        env:
          CYPRESS_API_KEY: ${{ secrets.API_KEY }}
          CYPRESS_MAGENTO_VERSION: "2.4"
          NODE_OPTIONS: "--max-old-space-size=4096"
